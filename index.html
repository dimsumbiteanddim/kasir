<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden text-sm">

    <!-- Navbar/Header -->
    <header class="bg-indigo-600 text-white p-2 sm:p-3 shadow-md flex justify-between items-center z-10 flex-shrink-0">
        <div class="flex items-center space-x-2">
            <i class="fas fa-cash-register text-lg sm:text-xl"></i>
            <h1 class="text-base sm:text-lg font-bold">Aplikasi Kasir</h1>
        </div>
        <div class="flex items-center space-x-3 text-xs sm:text-sm">
            <span><i class="fas fa-user-circle mr-1"></i> Admin</span>
            <span id="jam" class="font-mono bg-indigo-700 px-2 py-0.5 rounded">00:00:00</span>
        </div>
    </header>

    <!-- Content Utama -->
    <div class="flex-1 min-h-0 container mx-auto p-2 sm:p-2 grid grid-cols-1 lg:grid-cols-3 gap-1.5 items-start overflow-y-auto lg:overflow-hidden">
        
        <!-- Kolom Kiri: Menu & Pencarian -->
        <div class="lg:col-span-2 flex flex-col min-h-0 space-y-1">
            
            <!-- Pencarian & Kategori -->
            <div class="bg-white p-2 rounded-lg shadow-sm border flex-shrink-0 flex gap-2">
                <div class="relative flex-1">
                    <input type="text" id="cari_menu" placeholder="Cari nama menu..." class="w-full pl-8 pr-3 py-1.5 border rounded-md text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <i class="fas fa-search absolute left-2.5 top-2.5 text-gray-400 text-xs sm:text-sm"></i>
                </div>
                <select id="filter_kategori" class="border rounded-md px-2 py-1.5 text-xs sm:text-sm bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <option value="">Semua Kategori</option>
                    <option value="makanan">Makanan</option>
                    <option value="minuman">Minuman</option>
                    <option value="snack">Snack</option>
                </select>
            </div>

            <!-- Kontainer Kartu Menu -->
            <div id="kontainer_kartu_menu" class="flex-1 min-h-0 overflow-y-auto space-y-1 pr-1">
                <!-- Kartu-kartu menu akan dimasukkan secara dinamis di sini oleh JS -->
            </div>

            <!-- Pesanan Online -->
            <div class="bg-white p-2 rounded-lg shadow-sm border flex-shrink-0">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="font-semibold text-xs sm:text-sm flex items-center gap-1.5 text-gray-700">
                        <i class="fas fa-globe text-indigo-500"></i> Pesanan Online
                    </h2>
                    <span class="bg-indigo-100 text-indigo-800 text-[10px] font-medium px-2 py-0.5 rounded-full">3 Baru</span>
                </div>
                <div class="space-y-1 max-h-24 overflow-y-auto">
                    <div class="flex justify-between items-center text-xs p-1.5 bg-gray-50 rounded border">
                        <div>
                            <span class="font-medium">#ORD-9012</span>
                            <span class="text-gray-500 ml-1">(Gojek)</span>
                        </div>
                        <button class="bg-indigo-600 text-white px-2 py-0.5 rounded text-[10px] hover:bg-indigo-700">Proses</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Kolom Kanan: Keranjang / Pesanan -->
        <div class="bg-white rounded-lg shadow-sm border flex flex-col h-full overflow-hidden">
            <div class="p-2 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="font-semibold text-xs sm:text-sm text-gray-700 flex items-center gap-1.5">
                    <i class="fas fa-shopping-cart text-indigo-500"></i> Keranjang Pesanan
                </h2>
                <button id="btn_kosongkan" class="text-red-500 hover:text-red-700 text-xs">
                    <i class="fas fa-trash-alt mr-1"></i>Hapus
                </button>
            </div>

            <!-- Daftar Item Keranjang -->
            <div id="kontainer_keranjang" class="flex-1 overflow-y-auto p-2 space-y-2 divide-y divide-gray-100">
                <!-- Item keranjang akan muncul di sini -->
                <div class="text-center py-8 text-gray-400 text-xs">
                    <i class="fas fa-shopping-basket text-3xl mb-1 text-gray-300"></i>
                    <p>Keranjang masih kosong</p>
                </div>
            </div>

            <!-- Ringkasan & Pembayaran -->
            <div class="p-2 border-t bg-gray-50 space-y-2 flex-shrink-0">
                <div class="space-y-1 text-xs">
                    <div class="flex justify-between text-gray-600">
                        <span>Subtotal</span>
                        <span id="text_subtotal">Rp 0</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>Pajak (10%)</span>
                        <span id="text_pajak">Rp 0</span>
                    </div>
                    <div class="flex justify-between font-bold text-sm text-gray-800 pt-1 border-t">
                        <span>Total</span>
                        <span id="text_total" class="text-indigo-600">Rp 0</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-1.5 pt-1">
                    <button id="btn_simpan" class="w-full bg-gray-200 text-gray-700 py-1.5 rounded-md font-medium text-xs hover:bg-gray-300 transition">
                        <i class="fas fa-bookmark mr-1"></i>Simpan
                    </button>
                    <button id="btn_bayar" class="w-full bg-indigo-600 text-white py-1.5 rounded-md font-medium text-xs hover:bg-indigo-700 transition">
                        <i class="fas fa-money-bill-wave mr-1"></i>Bayar
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Script Logika Sederhana & Waktu -->
    <script>
        function updateJam() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
            $('#jam').text(timeString);
        }
        setInterval(updateJam, 1000);
        updateJam();
    </script>
</body>
</html>
