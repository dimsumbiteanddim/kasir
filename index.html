<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - BITE AND DIM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <!-- HEADER / NAVBAR -->
    <header class="bg-amber-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">POS Kasir - BITE AND DIM</h1>
            <p class="text-xs text-amber-100">Sistem Pencatatan Transaksi Kasir</p>
        </div>
        <div class="flex items-center gap-3">
            <span id="indikator-status" class="text-xs bg-emerald-500 px-2 py-1 rounded text-white font-medium">Sistem Siap</span>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- KOLOM KIRI & TENGAH: DAFTAR MENU -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-700">Daftar Menu Produk</h2>
                <div class="text-sm text-gray-500">
                    Stok Dimsum: <strong id="stok-dimsum-text" class="text-amber-600">0</strong> pcs | 
                    Stok Tahu: <strong id="stok-tahu-text" class="text-amber-800">0</strong> pcs
                </div>
            </div>

            <!-- CONTAINER KARTU MENU -->
            <div id="container-menu" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Kartu menu di-render via Javascript -->
            </div>
        </div>

        <!-- KOLOM KANAN: KERANJANG & TRANSAKSI -->
        <div class="space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 sticky top-20">
                <h2 class="text-lg font-bold text-gray-800 border-b pb-3 mb-4">Keranjang Transaksi</h2>
                
                <!-- INPUT DATA PELANGGAN -->
                <div class="space-y-3 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Pelanggan / Catatan</label>
                        <input type="text" id="kasir_pelanggan" placeholder="Pelanggan Umum" value="Pelanggan Umum" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nomor WA (Opsional)</label>
                        <input type="number" id="kasir_wa" placeholder="08xxx / -" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>
                </div>

                <!-- DAFTAR ITEM KERANJANG -->
                <div id="container-keranjang" class="divide-y divide-gray-100 max-h-60 overflow-y-auto mb-4 border-t border-b py-2">
                    <p class="text-sm text-gray-400 text-center py-4">Keranjang masih kosong</p>
                </div>

                <!-- TOTAL & ACTION -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-base font-semibold">
                        <span>Total Qty Item:</span>
                        <span id="total-qty-text">0 pcs</span>
                    </div>
                    <div class="flex justify-between items-center text-lg font-bold text-amber-600 border-t pt-2">
                        <span>Total Bayar:</span>
                        <span id="total-bayar-text">Rp 0</span>
                    </div>

                    <button onclick="prosesBayarKasir()" id="btn-bayar" disabled class="w-full bg-amber-600 hover:bg-amber-700 disabled:bg-gray-300 text-white font-bold py-3 rounded-xl shadow transition duration-200 text-center">
                        Proses Transaksi Offline
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT JAVASCRIPT LOGIKA KASIR -->
    <script>
        // URL WEB APP GOOGLE APPS SCRIPT KAMU
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwqV5o9Gf3N_EXAMPLE/exec"; // ganti dengan URL Web App milikmu jika beda

        // DATA DEKLARASI MENU
        const daftarKartuMenu = [
            {
                namaKartu: "Dimsum Original",
                kategoriBahan: "dimsum",
                temaWarna: "bg-amber-500 text-white",
                items: [
                    { nama: "Dimsum Original", harga: 4000, desc: "Satuan", isiPcs: 1 },
                    { nama: "Paket Hemat", harga: 12000, desc: "Isi 3 pcs", isiPcs: 3 },
                    { nama: "Paket Kenyang", harga: 20000, desc: "Isi 5 pcs", isiPcs: 5 },
                    { nama: "Paket Ramean", harga: 31000, desc: "Isi 8 pcs", isiPcs: 8 }
                ]
            },
            {
                namaKartu: "Dimsum Mentai",
                kategoriBahan: "dimsum",
                temaWarna: "bg-orange-500 text-white",
                items: [
                    { nama: "Dimsum Mentai", harga: 5000, desc: "Satuan", isiPcs: 1 },
                    { nama: "Paket Hemat", harga: 15000, desc: "Isi 3 pcs", isiPcs: 3 },
                    { nama: "Paket Kenyang", harga: 25000, desc: "Isi 5 pcs", isiPcs: 5 },
                    { nama: "Paket Ramean", harga: 38000, desc: "Isi 8 pcs", isiPcs: 8 }
                ]
            },
            {
                namaKartu: "Dimsum Keju",
                kategoriBahan: "dimsum",
                temaWarna: "bg-yellow-500 text-black",
                items: [
                    { nama: "Dimsum Keju", harga: 5000, desc: "Satuan", isiPcs: 1 },
                    { nama: "Paket Hemat", harga: 15000, desc: "Isi 3 pcs", isiPcs: 3 },
                    { nama: "Paket Kenyang", harga: 25000, desc: "Isi 5 pcs", isiPcs: 5 },
                    { nama: "Paket Ramean", harga: 38000, desc: "Isi 8 pcs", isiPcs: 8 }
                ]
            },
            {
                namaKartu: "Dimsum Mix",
                kategoriBahan: "dimsum",
                temaWarna: "bg-teal-600 text-white",
                items: [
                    { nama: "Paket Hemat", harga: 14000, desc: "Isi 3 pcs", isiPcs: 3 },
                    { nama: "Paket Kenyang", harga: 22000, desc: "Isi 5 pcs", isiPcs: 5 },
                    { nama: "Paket Ramean", harga: 35000, desc: "Isi 8 pcs", isiPcs: 8 }
                ]
            },
            {
                namaKartu: "Tahu Bakso Goreng",
                kategoriBahan: "tahu",
                temaWarna: "bg-amber-800 text-white",
                items: [
                    { nama: "Box Kecil", harga: 10000, desc: "Isi 10 pcs", isiPcs: 10 },
                    { nama: "Box Besar", harga: 20000, desc: "Isi 20 pcs", isiPcs: 20 }
                ]
            }
        ];

        // MEMORI KASIR
        let keranjangKasir = [];
        let stokDapurPcs = { dimsum: 999, tahu: 999 };

        // 1. KUNCI UTAMA SOLUSI: Objek penampung nilai Qty yang sedang diatur kasir
        let inputQtyKartu = {}; 

        window.onload = function() {
            renderMenu();
            ambilStokLive();
            // Polling auto-refresh stok setiap 5 detik
            setInterval(ambilStokLive, 5000); 
        };

        // AMBIL STOK LIVE DARIPADA RE-RENDER ULANG LENGKAP
        function ambilStokLive() {
            fetch(URL_WEB_APP)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        stokDapurPcs.dimsum = data.stokDimsumPcs || 0;
                        stokDapurPcs.tahu = data.stokTahuPcs || 0;

                        document.getElementById('stok-dimsum-text').innerText = stokDapurPcs.dimsum;
                        document.getElementById('stok-tahu-text').innerText = stokDapurPcs.tahu;
                        
                        // Re-render menu saat auto refresh
                        renderMenu();
                    }
                })
                .catch(err => console.log("Gagal sync stok:", err));
        }

        // RENDER MENU UTAMA
        function renderMenu() {
            const container = document.getElementById('container-menu');
            let html = '';

            daftarKartuMenu.forEach((kartu) => {
                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="${kartu.temaWarna} px-4 py-2 font-bold text-sm">
                            ${kartu.namaKartu}
                        </div>
                        <div class="p-3 divide-y divide-gray-100">
                `;

                kartu.items.forEach((item) => {
                    // Unique Key untuk setiap pilihan produk
                    let keyItem = `${kartu.namaKartu} - ${item.nama}`;
                    
                    // MEMBACA NILAI SEMENTARA: Jika kasir pernah ubah ke 4, pakai 4. Jika belum ada, default 1.
                    let qtySaatIni = inputQtyKartu[keyItem] || 1;

                    html += `
                        <div class="py-2.5 flex items-center justify-between gap-2">
                            <div>
                                <div class="font-semibold text-sm text-gray-800">${item.nama}</div>
                                <div class="text-xs text-gray-500">Rp ${item.harga.toLocaleString('id-ID')} (${item.desc})</div>
                            </div>
                            
                            <!-- KONTROL PENGATUR QTY (TIDAK AKAN BALIK KE 1 SAAT REFRESH) -->
                            <div class="flex items-center gap-1.5">
                                <button onclick="ubahInputQty('${keyItem}', -1)" class="w-7 h-7 flex items-center justify-center bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-bold text-gray-700">-</button>
                                
                                <span id="qty-disp-${btoa(keyItem).replace(/=/g,'')}" class="w-8 text-center text-sm font-bold">${qtySaatIni}</span>
                                
                                <button onclick="ubahInputQty('${keyItem}', 1)" class="w-7 h-7 flex items-center justify-center bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-bold text-gray-700">+</button>
                                
                                <button onclick="tambahKeKeranjangKasir('${kartu.namaKartu}', '${item.nama}', ${item.harga}, ${item.isiPcs})" class="ml-1 bg-amber-500 hover:bg-amber-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow-sm">
                                    + Tambah
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // FUNGSI MENGUBAH ANGKA SEMENTARA (HANYA MERUBAH ANGKA PADA OBJEK DAN TEXT HTML SEMENTARA)
        function ubahInputQty(keyItem, delta) {
            if (!inputQtyKartu[keyItem]) {
                inputQtyKartu[keyItem] = 1;
            }

            let nilBaru = inputQtyKartu[keyItem] + delta;
            if (nilBaru < 1) nilBaru = 1; // Minimal 1

            // Simpan nilai baru di memori sementara
            inputQtyKartu[keyItem] = nilBaru;

            // Langsung update elemen teks di layar tanpa merender ulang seluruh HTML menu
            let safeId = "qty-disp-" + btoa(keyItem).replace(/=/g,'');
            let elSpan = document.getElementById(safeId);
            if (elSpan) {
                elSpan.innerText = nilBaru;
            }
        }

        // FUNGSI MEMASUKKAN BARANG KE KERANJANG
        function tambahKeKeranjangKasir(namaKartu, namaItem, harga, isiPcs) {
            let keyItem = `${namaKartu} - ${namaItem}`;
            
            // Ambil Qty pilihan kasir saat ini (misal 4)
            let qtyDipilih = inputQtyKartu[keyItem] || 1;

            // Masukkan / Update ke array keranjang
            let itemAda = keranjangKasir.find(i => i.produk === keyItem);
            if (itemAda) {
                itemAda.qty += qtyDipilih;
                itemAda.subtotal = itemAda.qty * harga;
            } else {
                keranjangKasir.push({
                    produk: keyItem,
                    harga: harga,
                    qty: qtyDipilih,
                    subtotal: harga * qtyDipilih,
                    isiPcs: isiPcs
                });
            }

            // RESET NILAI SEMENTARA HANYA SETELAH TOMBOL TAMBAH DIKLIK
            inputQtyKartu[keyItem] = 1;

            // Render ulang Tampilan
            renderKeranjang();
            renderMenu();
        }

        // RENDER TAMPILAN KERANJANG
        function renderKeranjang() {
            const container = document.getElementById('container-keranjang');
            let totalBayar = 0;
            let totalQty = 0;

            if (keranjangKasir.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-400 text-center py-4">Keranjang masih kosong</p>`;
                document.getElementById('btn-bayar').disabled = true;
                document.getElementById('total-qty-text').innerText = '0 pcs';
                document.getElementById('total-bayar-text').innerText = 'Rp 0';
                return;
            }

            let html = '';
            keranjangKasir.forEach((item, index) => {
                totalBayar += item.subtotal;
                totalQty += item.qty;

                html += `
                    <div class="py-2 flex items-center justify-between text-sm">
                        <div class="flex-1 pr-2">
                            <div class="font-semibold text-gray-800">${item.produk}</div>
                            <div class="text-xs text-gray-500">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</div>
                        </div>
                        <div class="font-bold text-gray-700 mr-3">
                            Rp ${item.subtotal.toLocaleString('id-ID')}
                        </div>
                        <button onclick="hapusItemKeranjang(${index})" class="text-red-500 hover:text-red-700 font-bold text-base">
                            &times;
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            document.getElementById('total-qty-text').innerText = totalQty + ' Porsi';
            document.getElementById('total-bayar-text').innerText = 'Rp ' + totalBayar.toLocaleString('id-ID');
            document.getElementById('btn-bayar').disabled = false;
        }

        // HAPUS ITEM DARI KERANJANG
        function hapusItemKeranjang(index) {
            keranjangKasir.splice(index, 1);
            renderKeranjang();
        }

        // PROSES BAYAR KE GOOGLE SHEETS
        function prosesBayarKasir() {
            if (keranjangKasir.length === 0) return;

            const btn = document.getElementById('btn-bayar');
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const payload = {
                action: "directKasirOrder",
                namaPelanggan: document.getElementById('kasir_pelanggan').value.trim() || "Pelanggan Umum",
                nomorWA: document.getElementById('kasir_wa').value.trim() || "-",
                tipeOrder: "Offline Kasir",
                items: keranjangKasir
            };

            fetch(URL_WEB_APP, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(resData => {
                if (resData.status === "success") {
                    alert(`✅ Transaksi Berhasil!\nID: ${resData.idPesanan}`);
                    
                    // Reset Keranjang & Form
                    keranjangKasir = [];
                    document.getElementById('kasir_pelanggan').value = "Pelanggan Umum";
                    document.getElementById('kasir_wa').value = "";
                    
                    renderKeranjang();
                    ambilStokLive();
                } else {
                    alert("❌ Gagal menyimpan transaksi: " + resData.message);
                }
            })
            .catch(err => {
                alert("❌ Terjadi kesalahan koneksi.");
                console.error(err);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Proses Transaksi Offline";
            });
        }
    </script>
</body>
</html>
