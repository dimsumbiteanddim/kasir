<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Bite & Dim</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .accordion-open {
            max-height: 1000px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-24 md:pb-6">

    <!-- HEADER / NAVBAR -->
    <header class="bg-amber-600 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🥟</span>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Bite & Dim</h1>
                    <p class="text-xs text-amber-100">Aplikasi Kasir POS</p>
                </div>
            </div>
            <!-- Status Stok Dapur Ringkas -->
            <div class="flex gap-2 text-xs">
                <div class="bg-amber-700/60 px-3 py-1 rounded-lg border border-amber-400/30">
                    <span class="block text-amber-200 text-[10px]">Stok Dimsum</span>
                    <span id="labelStokDimsumHeader" class="font-bold">0 pcs</span>
                </div>
                <div class="bg-amber-700/60 px-3 py-1 rounded-lg border border-amber-400/30">
                    <span class="block text-amber-200 text-[10px]">Stok Tahu</span>
                    <span id="labelStokTahuHeader" class="font-bold">0 pcs</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- KOLOM KIRI & TENGAH: MENU & PESANAN ONLINE -->
        <section class="lg:col-span-2 space-y-6">

            <!-- NOTIFIKASI PESANAN ONLINE MASUK -->
            <div id="wrapperPesananPending" class="space-y-3">
                <!-- Pesanan pending akan muncul di sini via JS -->
            </div>

            <!-- DAFTAR MENU (ACCORDION / CARDS) -->
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                        <span>📋</span> Menu Penjualan
                    </h2>
                    <button onclick="muatMenuDariSpreadsheet()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg transition font-medium">
                        🔄 Refresh Menu
                    </button>
                </div>

                <!-- Container Kartu Menu -->
                <div id="containerKartuMenu" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Kartu menu dari Spreadsheet dimuat di sini -->
                    <div class="col-span-full text-center py-12 text-slate-400">
                        <p class="animate-pulse">⏳ Memuat daftar menu dari Google Sheets...</p>
                    </div>
                </div>
            </div>

        </section>


        <!-- KOLOM KANAN: KERANJANG & CHECKOUT KASIR -->
        <section class="lg:col-span-1">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sticky top-20">
                <h2 class="text-lg font-bold text-slate-800 mb-4 pb-3 border-b border-slate-100 flex items-center justify-between">
                    <span class="flex items-center gap-2">🛒 Keranjang Kasir</span>
                    <button onclick="kosongkanKeranjang()" class="text-xs text-rose-500 hover:underline">Reset</button>
                </h2>

                <!-- Form Detail Pelanggan -->
                <div class="space-y-3 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Pelanggan (Opsional)</label>
                        <input type="text" id="inputNamaPelanggan" placeholder="Pelanggan Offline" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Nomor WA</label>
                            <input type="text" id="inputNomorWA" placeholder="08xxx" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Tipe Order</label>
                            <select id="selectTipeOrder" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                                <option value="Dine-In">Dine-In</option>
                                <option value="Takeaway">Takeaway</option>
                                <option value="Offline">Offline</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Daftar Item Keranjang -->
                <div id="containerKeranjang" class="space-y-3 max-h-60 overflow-y-auto pr-1 mb-4 divide-y divide-slate-100">
                    <p class="text-xs text-center text-slate-400 py-6">Keranjang masih kosong</p>
                </div>

                <!-- Total & Tombol Bayar -->
                <div class="pt-3 border-t border-slate-100 space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-semibold text-slate-600">Total Pembayaran</span>
                        <span id="labelTotalHarga" class="text-xl font-bold text-amber-600">Rp 0</span>
                    </div>

                    <button onclick="prosesBayarKasir()" id="btnProsesBayar" disabled class="w-full bg-amber-500 hover:bg-amber-600 disabled:bg-slate-300 text-white font-bold py-3 rounded-xl shadow-md transition duration-200">
                        Proses Transaksi Kasir
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="containerToast" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>


    <!-- JAVASCRIPT APLIKASI -->
    <script>
        // ==========================================
        // KONFIGURASI URL APPS SCRIPT
        // ==========================================
        const urlWebApp = "https://script.google.com/macros/s/AKfycbwqP3_CONTOH_DEPLOYMENT_ID/exec"; // GANTI DENGAN URL WEB APP KAMU

        // State Aplikasi
        let daftarKartuMenu = [];
        let keranjang = [];
        let stokDapur = { dimsum: 0, tahu: 0 };
        let pesananPendingCache = [];

        // ==========================================
        // 1. MEMUAT MENU DARI SPREADSHEET (GAS)
        // ==========================================
        function muatMenuDariSpreadsheet() {
            fetch(`${urlWebApp}?action=getMenu`)
                .then(res => res.json())
                .then(dataMenu => {
                    if (Array.isArray(dataMenu) && dataMenu.length > 0) {
                        daftarKartuMenu = dataMenu;
                        renderKartuMenu();
                    } else {
                        tampilkanToast("⚠️ Data menu di Spreadsheet kosong atau tidak sesuai", "error");
                    }
                })
                .catch(err => {
                    console.error("Gagal memuat menu:", err);
                    tampilkanToast("❌ Gagal memuat daftar menu dari server", "error");
                });
        }

        // ==========================================
        // 2. RENDER KARTU MENU (ACCORDION)
        // ==========================================
        function renderKartuMenu() {
            const container = document.getElementById('containerKartuMenu');
            if (!daftarKartuMenu || daftarKartuMenu.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center py-6 text-slate-400 text-sm">Tidak ada menu yang tersedia.</p>`;
                return;
            }

            container.innerHTML = daftarKartuMenu.map((kartu, index) => {
                const idAccordion = `accordion-${index}`;
                return `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <!-- Header Accordion -->
                        <button onclick="toggleAccordion('${idAccordion}')" class="w-full ${kartu.temaWarna || 'bg-amber-500 text-white'} px-4 py-3 flex justify-between items-center text-left font-bold transition">
                            <span>${kartu.namaKartu}</span>
                            <span id="icon-${idAccordion}" class="text-sm transform transition-transform">▼</span>
                        </button>

                        <!-- Content Accordion -->
                        <div id="${idAccordion}" class="accordion-content">
                            <div class="p-3 space-y-2 divide-y divide-slate-100">
                                ${kartu.items.map(item => `
                                    <div class="pt-2 first:pt-0 flex justify-between items-center gap-2">
                                        <div>
                                            <h4 class="font-semibold text-sm text-slate-800">${item.nama}</h4>
                                            <p class="text-xs text-slate-400">${item.desc || ''}</p>
                                            <span class="text-xs font-bold text-amber-600">Rp ${Number(item.harga).toLocaleString('id-ID')}</span>
                                        </div>
                                        <button onclick="tambahKeKeranjang('${kartu.namaKartu}', '${item.nama}', ${item.harga}, '${kartu.kategoriBahan}', ${item.isiPcs})" 
                                                class="bg-amber-100 hover:bg-amber-200 text-amber-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                                            + Tambah
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if (el.classList.contains('accordion-open')) {
                el.classList.remove('accordion-open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                el.classList.add('accordion-open');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        // ==========================================
        // 3. LOGIKA KERANJANG KASIR
        // ==========================================
        function tambahKeKeranjang(namaKartu, namaItem, harga, kategoriBahan, isiPcs) {
            const itemKey = `${namaKartu} - ${namaItem}`;
            const adaItem = keranjang.find(i => i.key === itemKey);

            if (adaItem) {
                adaItem.qty += 1;
            } else {
                keranjang.push({
                    key: itemKey,
                    namaKartu: namaKartu,
                    namaItem: namaItem,
                    harga: harga,
                    kategoriBahan: kategoriBahan,
                    isiPcs: isiPcs || 1,
                    qty: 1
                });
            }
            updateTampilanKeranjang();
        }

        function ubahQtyItem(key, delta) {
            const index = keranjang.findIndex(i => i.key === key);
            if (index !== -1) {
                keranjang[index].qty += delta;
                if (keranjang[index].qty <= 0) {
                    keranjang.splice(index, 1);
                }
            }
            updateTampilanKeranjang();
        }

        function kosongkanKeranjang() {
            keranjang = [];
            updateTampilanKeranjang();
        }

        function updateTampilanKeranjang() {
            const container = document.getElementById('containerKeranjang');
            const labelTotal = document.getElementById('labelTotalHarga');
            const btnProses = document.getElementById('btnProsesBayar');

            if (keranjang.length === 0) {
                container.innerHTML = `<p class="text-xs text-center text-slate-400 py-6">Keranjang masih kosong</p>`;
                labelTotal.innerText = "Rp 0";
                btnProses.disabled = true;
                return;
            }

            let totalHarga = 0;
            container.innerHTML = keranjang.map(item => {
                const subtotal = item.harga * item.qty;
                totalHarga += subtotal;
                return `
                    <div class="flex justify-between items-center pt-2">
                        <div>
                            <h5 class="text-xs font-semibold text-slate-800">${item.namaKartu} - ${item.namaItem}</h5>
                            <span class="text-[11px] text-slate-500">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty} = Rp ${subtotal.toLocaleString('id-ID')}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="ubahQtyItem('${item.key}', -1)" class="w-6 h-6 bg-slate-200 text-slate-700 rounded flex items-center justify-center font-bold text-xs">-</button>
                            <span class="text-xs font-bold px-1">${item.qty}</span>
                            <button onclick="ubahQtyItem('${item.key}', 1)" class="w-6 h-6 bg-slate-200 text-slate-700 rounded flex items-center justify-center font-bold text-xs">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            labelTotal.innerText = `Rp ${totalHarga.toLocaleString('id-ID')}`;
            btnProses.disabled = false;
        }

        // ==========================================
        // 4. PROSES TRANSAKSI KASIR (POST directKasirOrder)
        // ==========================================
        function prosesBayarKasir() {
            if (keranjang.length === 0) return;

            const namaPelanggan = document.getElementById('inputNamaPelanggan').value.trim() || "Pelanggan Offline";
            const nomorWA = document.getElementById('inputNomorWA').value.trim() || "-";
            const tipeOrder = document.getElementById('selectTipeOrder').value;

            const itemsPayload = keranjang.map(item => ({
                produk: `${item.namaKartu} - ${item.namaItem}`,
                qty: item.qty,
                subtotal: item.harga * item.qty
            }));

            const payload = {
                action: "directKasirOrder",
                namaPelanggan: namaPelanggan,
                nomorWA: nomorWA,
                tipeOrder: tipeOrder,
                items: itemsPayload
            };

            const btn = document.getElementById('btnProsesBayar');
            btn.disabled = true;
            btn.innerText = "Memproses...";

            fetch(urlWebApp, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    tampilkanToast(`✅ Transaksi Berhasil! ID: ${res.idPesanan}`, "success");
                    kosongkanKeranjang();
                    document.getElementById('inputNamaPelanggan').value = '';
                    document.getElementById('inputNomorWA').value = '';
                    syncSemuaData();
                } else {
                    tampilkanToast("❌ Gagal: " + res.message, "error");
                }
            })
            .catch(err => {
                console.error("Error transaksi:", err);
                tampilkanToast("❌ Terjadi kesalahan koneksi", "error");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Proses Transaksi Kasir";
            });
        }

        // ==========================================
        // 5. SYNC STOK & PESANAN PENDING (POLLING)
        // ==========================================
        function syncSemuaData() {
            // A. Ambil Stok
            fetch(urlWebApp)
                .then(res => res.json())
                .then(stok => {
                    if (stok && stok.stokDimsumPcs !== undefined) {
                        document.getElementById('labelStokDimsumHeader').innerText = `${stok.stokDimsumPcs} pcs`;
                        document.getElementById('labelStokTahuHeader').innerText = `${stok.stokTahuPcs} pcs`;
                        stokDapur = { dimsum: stok.stokDimsumPcs, tahu: stok.stokTahuPcs };
                    }
                })
                .catch(err => console.error("Gagal sync stok:", err));

            // B. Ambil Pesanan Pending Online
            fetch(`${urlWebApp}?action=getPendingOrders`)
                .then(res => res.json())
                .then(orders => {
                    if (Array.isArray(orders)) {
                        renderPesananPending(orders);
                    }
                })
                .catch(err => console.error("Gagal sync pesanan pending:", err));
        }

        function renderPesananPending(orders) {
            const container = document.getElementById('wrapperPesananPending');
            if (!orders || orders.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = orders.map(ord => `
                <div class="bg-rose-50 border-2 border-rose-300 rounded-xl p-4 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded">ONLINE</span>
                            <h4 class="font-bold text-slate-800 text-sm">${ord.namaPelanggan} (${ord.nomorWA})</h4>
                        </div>
                        <p class="text-xs text-slate-600 whitespace-pre-line mt-1">${ord.produk}</p>
                        <p class="text-xs font-bold text-rose-600 mt-1">Total: Rp ${Number(ord.totalHarga).toLocaleString('id-ID')}</p>
                    </div>
                    <div class="flex items-center gap-2 w-full md:w-auto">
                        <button onclick="SelesaikanPesananOnline(${ord.rowIndex})" class="flex-1 md:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">
                            Selesaikan
                        </button>
                        <button onclick="BatalkanPesananOnline(${ord.rowIndex})" class="flex-1 md:flex-initial bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-3 py-2 rounded-lg transition">
                            Batal
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function SelesaikanPesananOnline(rowIndex) {
            fetch(urlWebApp, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "completeOrder", rowIndex: rowIndex })
            })
            .then(res => res.json())
            .then(res => {
                tampilkanToast(res.message, res.status === "success" ? "success" : "error");
                syncSemuaData();
            });
        }

        function BatalkanPesananOnline(rowIndex) {
            if (!confirm("Yakin ingin membatalkan pesanan ini?")) return;
            fetch(urlWebApp, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "cancelOrder", rowIndex: rowIndex })
            })
            .then(res => res.json())
            .then(res => {
                tampilkanToast(res.message, "warning");
                syncSemuaData();
            });
        }

        // ==========================================
        // 6. HELPER TOAST NOTIFICATION
        // ==========================================
        function tampilkanToast(pesan, jenis = "info") {
            const container = document.getElementById('containerToast');
            const toast = document.createElement('div');
            
            let bgClass = "bg-slate-800 text-white";
            if (jenis === "success") bgClass = "bg-emerald-600 text-white";
            if (jenis === "error") bgClass = "bg-rose-600 text-white";
            if (jenis === "warning") bgClass = "bg-amber-600 text-white";

            toast.className = `${bgClass} px-4 py-2.5 rounded-lg shadow-lg text-xs font-semibold transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerText = pesan;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Pemicu Suara Otomatis
        function pemicuSuaraOtomatis() {
            if ('speechSynthesis' in window) {
                const utter = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(utter);
            }
        }

        // INITIALIZATION
        window.onload = function() {
            muatMenuDariSpreadsheet();
            syncSemuaData();
            setInterval(syncSemuaData, 3000);

            document.addEventListener('click', pemicuSuaraOtomatis, { once: true });
            document.addEventListener('touchstart', pemicuSuaraOtomatis, { once: true });
        };
    </script>
</body>
</html>
