<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir POS - Bite & Dim</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-900 pb-10">

    <!-- HEADER KASIR -->
    <div class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-30">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🖥️</span>
                <div>
                    <h1 class="font-black text-base sm:text-lg">KASIR POS - BITE & DIM</h1>
                    <p class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Real-time Sync Pesanan Online
                    </p>
                </div>
            </div>
            <!-- Tombol Aktivasi Suara (Kebijakan Autoplay Browser) -->
            <button id="btn_aktifkan_suara" onclick="aktifkanSuara()" class="bg-amber-500 hover:bg-amber-600 text-black font-extrabold text-xs px-3 py-1.5 rounded-lg shadow cursor-pointer">
                🔔 Aktifkan Suara Notif
            </button>
        </div>
    </div>

    <!-- UTAMA -->
    <div class="container mx-auto p-4 max-w-4xl">
        
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-base font-black text-gray-800 flex items-center gap-2">
                <span>📥 Pesanan Masuk (Online)</span>
                <span id="badge_total" class="bg-amber-500 text-black text-xs font-black px-2 py-0.5 rounded-full">0</span>
            </h2>
            <span class="text-xs text-gray-500 font-semibold">Refresh otomatis tiap 3 dtk</span>
        </div>

        <!-- KONTAINER LIST PESANAN -->
        <div id="list_pesanan_masuk" class="space-y-4">
            <p class="text-center text-gray-400 font-semibold text-xs py-10 bg-white rounded-2xl shadow-sm border">
                ⏳ Memuat pesanan masuk...
            </p>
        </div>

    </div>

    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT KAMU DI SINI:
        const urlWebApp = "https://script.google.com/macros/s/AKfycbxijavfFwCPC4BrH2-hYpZIN2tJuhfN4hmLo9eGRxKCkVnPGZXPF8CtXIqrzsNGUtOqmA/exec";

        let jumlahPesananSebelumnya = 0;
        let isAudioAllowed = false;

        window.onload = function() {
            cekPesananMasuk();
            setInterval(cekPesananMasuk, 3000); // Auto Sync Tiap 3 Detik
        };

        // Membuka blokir Autoplay Audio browser
        function aktifkanSuara() {
            isAudioAllowed = true;
            bunyikanNotifikasiSuara("Suara notifikasi kasir telah aktif!");
            let btn = document.getElementById("btn_aktifkan_suara");
            btn.innerText = "🔊 Suara Aktif";
            btn.className = "bg-emerald-500 text-white font-extrabold text-xs px-3 py-1.5 rounded-lg shadow";
        }

        // Fungsi Membunyikan "Ada pesanan masuk!" via Text-to-Speech
        function bunyikanNotifikasiSuara(teks = "Ada pesanan masuk!") {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Hentikan suara sebelumnya jika menumpuk
                let ucapan = new SpeechSynthesisUtterance(teks);
                ucapan.lang = 'id-ID'; // Bahasa Indonesia
                ucapan.rate = 1.0;
                ucapan.pitch = 1.1;
                window.speechSynthesis.speak(ucapan);
            }
        }

        function cekPesananMasuk() {
            fetch(`${urlWebApp}?action=getPendingOrders`)
                .then(res => res.json())
                .then(data => {
                    renderPesanan(data);

                    // Deteksi Jika Ada Pesanan Baru Masuk
                    if (data.length > jumlahPesananSebelumnya) {
                        if (isAudioAllowed) {
                            bunyikanNotifikasiSuara("Ada pesanan masuk!");
                        }
                    }
                    jumlahPesananSebelumnya = data.length;
                    document.getElementById("badge_total").innerText = data.length;
                })
                .catch(err => console.log("Gagal memuat pesanan kasir:", err));
        }

        function renderPesanan(listOrders) {
            let container = document.getElementById("list_pesanan_masuk");

            if (!listOrders || listOrders.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 font-semibold text-xs py-12 bg-white rounded-2xl shadow-sm border border-gray-200">
                        ☕ Belum ada pesanan masuk baru.
                    </div>
                `;
                return;
            }

            let html = "";
            listOrders.forEach(order => {
                let tglFormat = new Date(order.tanggal).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

                html += `
                    <div class="bg-white rounded-2xl p-4 border-2 border-amber-400 shadow-md space-y-3 relative overflow-hidden">
                        <div class="bg-amber-500 text-black text-[10px] font-black px-3 py-1 absolute top-0 right-0 rounded-bl-xl uppercase tracking-wider">
                            ${order.status}
                        </div>

                        <div class="flex justify-between items-start pr-16">
                            <div>
                                <span class="text-[10px] font-bold text-gray-400 block">${order.idPesanan} • ${tglFormat} WITA</span>
                                <h3 class="text-base font-black text-gray-900">${order.namaPelanggan}</h3>
                                <p class="text-xs text-emerald-600 font-bold">📱 ${order.nomorWA}</p>
                            </div>
                        </div>

                        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 text-xs">
                            <p class="font-bold text-gray-500 mb-1">Rincian Menu:</p>
                            <p class="font-extrabold text-gray-800 text-sm leading-relaxed">${order.produk}</p>
                        </div>

                        <div class="flex justify-between items-center pt-1">
                            <div>
                                <span class="text-[10px] text-gray-500 block font-semibold">Total Tagihan:</span>
                                <span class="text-base font-black text-amber-600">Rp ${Number(order.totalHarga).toLocaleString('id-ID')}</span>
                            </div>

                            <button onclick="prosesSelesaikanOrder(${order.rowIndex}, this)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xs px-4 py-2.5 rounded-xl shadow cursor-pointer transition active:scale-95 flex items-center gap-1.5">
                                ✅ Selesaikan Pesanan
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function prosesSelesaikanOrder(rowIndex, btnElement) {
            if (!confirm("Yakin pesanan ini sudah selesai dan dibayar? Data akan dipindahkan ke Sheet Penjualan.")) return;

            btnElement.disabled = true;
            btnElement.innerText = "⏳ Memproses...";

            let payload = {
                action: "completeOrder",
                rowIndex: rowIndex
            };

            fetch(urlWebApp, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(resData => {
                if (resData.status === "success") {
                    if (isAudioAllowed) bunyikanNotifikasiSuara("Pesanan selesai");
                    cekPesananMasuk(); // Refresh list otomatis
                } else {
                    alert("Gagal memperbarui pesanan!");
                    btnElement.disabled = false;
                    btnElement.innerText = "✅ Selesaikan Pesanan";
                }
            })
            .catch(err => {
                console.log("Error:", err);
                btnElement.disabled = false;
                btnElement.innerText = "✅ Selesaikan Pesanan";
            });
        }
    </script>
</body>
</html>
